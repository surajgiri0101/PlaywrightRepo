name: Playwright Java Tests with Docker

on:
  schedule:
    - cron: "30 16 * * *"   # Run every day at 10:00 PM IST (16:30 UTC)
  workflow_dispatch:         # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t playwright-java-demo .

      - name: Run Playwright Tests in Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/reports:/app/reports \
            -v ${{ github.workspace }}/screenshots:/app/screenshots \
            -v ${{ github.workspace }}/videos:/app/videos \
            playwright-java-demo

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: reports

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: failed-screenshots
          path: screenshots

      - name: Upload Videos
        uses: actions/upload-artifact@v4
        with:
          name: browser-videos
          path: videos
